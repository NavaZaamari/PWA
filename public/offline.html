<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#3F4524" />
<title>آفلاین هستی | یوئین</title>
<link rel="icon" href="/favicon.ico" />
<style>
  html,body{margin:0;min-height:100%;}
  body{min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#F7F0E0;color:#4A1220;
    font-family:"Estedad Variable",Tahoma,system-ui,sans-serif;line-height:1.8;text-align:center;padding:24px;box-sizing:border-box;
    background-image:radial-gradient(ellipse at 100% 0%,rgba(233,220,188,.6),transparent 55%);}
  main{max-width:22rem}
  .logo{width:160px;height:160px;object-fit:contain;animation:f 4s ease-in-out infinite}
  h1{font-size:1.4rem;margin:16px 0 4px}
  p{margin:0;color:#3F4524;font-size:.95rem}
  button{margin-top:24px;min-height:44px;padding:0 24px;border:0;border-radius:14px;background:#7B1E34;color:#F7F0E0;font:inherit;font-weight:700;cursor:pointer}
  button:focus-visible{outline:2px solid #7B1E34;outline-offset:3px}
  @keyframes f{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-6px) rotate(1deg)}}
  @media (prefers-reduced-motion:reduce){.logo{animation:none}}
</style>
</head>
<body>
<main>
  <img class="logo" src="/yoin-logo.png" alt="یوئین | Yoin" />
  <h1>اینترنت چرت می‌زند…</h1>
  <p>وقتی دوباره آنلاین شدی، قفسه‌هایت همین‌جا منتظرت هستند.</p>
  <button type="button" onclick="location.reload()">دوباره امتحان کن</button>
</main>
</body>
</html>
